<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TILMO • Sprite Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#102b33;color:#edf7e7;font:14px sans-serif}header{padding:24px;max-width:1200px;margin:auto}h1{margin:0 0 8px;font-size:26px}p{color:#b7d7cc;line-height:1.7}a{color:#ffe1a1}button,select{font:inherit;color:#edf7e7;border:1px solid #83b2a4;background:#244a53;border-radius:7px;padding:9px 12px;margin:4px}button[aria-pressed=true]{background:#ffe1a1;color:#203d43}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.grid{max-width:1200px;margin:0 auto 30px;padding:0 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{border:1px solid #4d736b;background:radial-gradient(ellipse,#4f7764,#1b4148);border-radius:12px;text-align:center;padding:12px}.tile canvas{display:block;width:100%;max-height:250px;aspect-ratio:1;object-fit:contain}.tile b{font-size:12px;letter-spacing:2px}#status{color:#ffdf9f}label{font-size:12px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}header{padding:18px}.tile{padding:8px}}
</style></head><body><header><a href="/">← กลับเข้าเกม</a><h1>TILMO / Sprite Lab</h1><p>ชาย–หญิง • ยืนและวิ่ง 8 ทิศ • ภาพตัวละครมือเปล่า อาวุธแยกชั้น<br>จุดสีทอง = ระดับพื้น (เท้ายกพ้นพื้นได้) · ตรวจทิศและแอนิเมชันได้จากหน้านี้</p><div class="controls"><button data-sex="a" aria-pressed="true">ชาย</button><button data-sex="b" aria-pressed="false">หญิง</button><select id="state" aria-label="แอนิเมชัน"><option value="run">วิ่ง · 8 เฟรม / ทิศ</option><option value="idle">ยืน · 4 เฟรม / ทิศ</option></select><button id="play">หยุดแอนิเมชัน</button><button id="previous">← เฟรมก่อน</button><button id="step">เฟรมถัดไป →</button><select id="speed" aria-label="ความเร็วดูภาพ"><option value="1">ความเร็วในเกม</option><option value="0.5">ช้า ½ เท่า</option><option value="0.25">ช้า ¼ เท่า</option></select><label><input type="checkbox" id="sockets" checked> จุดยึดเท้า</label><span id="status">กำลังโหลดภาพ…</span></div></header><main class="grid" id="grid"></main><section style="max-width:1200px;margin:auto;padding:20px"><h2>ตรวจวงจรทั้งรอบ · 8 → 1</h2><select id="direction" aria-label="ทิศสำหรับดูวงจร"><option value="se">SE · เฉียงขวาล่าง</option><option value="e">E · ขวา</option><option value="s">S · ลง</option><option value="n">N · ขึ้น</option><option value="ne">NE · ขวาบน</option><option value="sw">SW · ซ้ายล่าง</option><option value="w">W · ซ้าย</option><option value="nw">NW · ซ้ายบน</option></select><div class="grid" id="cycle" style="padding:16px 0"></div></section><script type="module" src="/src/sprite-lab.js"></script></body></html>
